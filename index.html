<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متمردي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#3a0b24;--bg2:#0a0106;--fg:#fff1f4;--accent:#ff4d79;--gold:#ffd6a5;--muted:#ffb3c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 75%);color:var(--fg);font-family:'Amiri','Noto Naskh Arabic',Tahoma,serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#stage{position:relative;height:100%}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s}
.scene.on{opacity:1;visibility:visible}
.line{font-size:clamp(26px,6.2vw,46px);line-height:1.8;font-weight:700;text-shadow:0 0 24px rgba(255,77,121,.55)}
.line.soft{color:var(--muted);font-weight:400;font-size:clamp(22px,5vw,36px)}
.line.big{font-size:clamp(40px,11vw,84px);color:var(--accent);text-shadow:0 0 40px rgba(255,77,121,.9)}
.w{display:inline-block;margin:0 .14em;opacity:0;filter:blur(10px);transform:translateY(18px) scale(.9)}
.scene.on .w{animation:word 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes word{to{opacity:1;filter:blur(0);transform:none}}
.heart{width:clamp(110px,28vw,190px);filter:drop-shadow(0 0 30px rgba(255,77,121,.9));animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
#start{position:fixed;z-index:9;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#ff4d79,#ff8a5c);color:#fff;border:0;border-radius:999px;padding:18px 42px;font:700 24px 'Amiri',Tahoma,serif;cursor:pointer;box-shadow:0 0 50px rgba(255,77,121,.6);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 80px rgba(255,77,121,.95)}}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:linear-gradient(90deg,#ff4d79,var(--gold));z-index:10;transition:width 1s linear}
#mute{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:rgba(255,255,255,.1);color:var(--fg);border:0;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<button id="mute" aria-label="صوت">🔊</button>
<button id="start">▶ متمردي</button>
<div id="stage"></div>
<script>
/* النص: كل مشهد = أسطر. أي سطر يبدأ بـ ! يطلع كبير بالأحمر */
var S=[
["!متمردي"],
["!إنت إنسان قراف عزيز عندي"],
["راك جزء من حياتي","جزء مني","جزء من قلبي"],
["إنت مشي عندك بلاصة عندي","راك دقات قلبي","و لاريسبراسيون تاعي"],
["ماء… راك كل حاجة مهمة عندي"],
["ما نحطش راسي على المخدة","كون ما نخمّمش فيك","و ما ندعيلكش"],
["رغم البعد اللي بيناتنا","إنت دايما معايا","في كل تفصيلة من حياتي"],
["فمابالك يكون كاين ميساج من عندك","فرحتي ما نقدرش نمدها لواحد"],
["ممكن إنت تشوفها تفاصيل بسيطة","مي أنا… تعنيلي بزاااف"],
["نتمنى إنك ما تقيسش قيمتك عندي","على حساب هديك الكلمة","!نحبك"],
["HEART","!متمردي"]
];
var HEART='<svg class="heart" viewBox="0 0 32 29"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a9c"/><stop offset="1" stop-color="#e0214f"/></linearGradient></defs><path fill="url(#g)" d="M23.6 0c-3.4 0-5.7 2-7.6 4.3C14.1 2 11.8 0 8.4 0 3.8 0 0 3.6 0 8.2c0 9.2 14.3 18.7 16 20.8C17.7 26.900 32 17.400 32 8.200 32 3.600 28.200 0 23.600 0z"/></svg>';
var stage=document.getElementById('stage'),start=document.getElementById('start'),bar=document.getElementById('bar'),muteB=document.getElementById('mute');
var scenes=[],dur=[];
S.forEach(function(lines,i){
  var d=document.createElement('div'),n=0;d.className='scene';
  lines.forEach(function(t,j){
    if(t==='HEART'){d.insertAdjacentHTML('beforeend',HEART);return}
    var big=t.charAt(0)==='!';if(big)t=t.slice(1);
    var p=document.createElement('div');p.className='line'+(big?' big':(j>0?' soft':''));
    t.split(' ').forEach(function(w){var s=document.createElement('span');s.className='w';s.textContent=w;s.style.animationDelay=(n*.28)+'s';n++;p.appendChild(s)});
    d.appendChild(p);
  });
  stage.appendChild(d);scenes.push(d);dur.push(Math.max(5200,n*280+3600));
});
/* خلفية: نجوم + قلوب */
var cv=document.getElementById('c'),cx=cv.getContext('2d'),P=[],W,H,dpr=Math.min(window.devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+20,r:Math.random()*2+.6,v:Math.random()*.5+.15,h:Math.random()<.22,a:Math.random()*.6+.2,ph:Math.random()*6.28}}
for(var i=0;i<90;i++)P.push(mk(true));
function draw(t){
  cx.clearRect(0,0,W,H);
  P.forEach(function(p,i){
    p.y-=p.v;p.x+=Math.sin(t/1500+p.ph)*.25;
    if(p.y<-20)P[i]=mk(false);
    var tw=p.a*(.6+.4*Math.sin(t/500+p.ph));
    if(p.h){cx.fillStyle='rgba(255,77,121,'+tw+')';cx.font=(p.r*9)+'px serif';cx.fillText('♥',p.x,p.y)}
    else{cx.fillStyle='rgba(255,230,220,'+tw+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
/* موسيقى هادئة مولّدة بالكود (Web Audio) */
var ac,master,timer,step=0,muted=false;
var CH=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[261.63,329.63,392,523.25],[196,246.94,293.66,392]];
function note(f,t){
  var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.03);g.gain.exponentialRampToValueAtTime(.0008,t+1.8);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+1.9);
}
function music(){
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;
    var dl=ac.createDelay(1),fb=ac.createGain();dl.delayTime.value=.38;fb.gain.value=.4;
    master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);
    function tick(){var c=CH[Math.floor(step/8)%4],k=[0,1,2,3,2,1,2,3][step%8];note(c[k],ac.currentTime+.05);if(step%8===0)note(c[0]/2,ac.currentTime+.05);step++}
    tick();timer=setInterval(tick,520);
  }catch(e){}
}
muteB.onclick=function(){muted=!muted;if(master)master.gain.value=muted?0:.8;muteB.textContent=muted?'🔇':'🔊'};
/* التشغيل */
var T=[];
function play(){
  start.style.display='none';muteB.style.display='block';T.forEach(clearTimeout);T=[];step=0;
  if(!ac)music();else if(ac.state==='suspended')ac.resume();
  var at=0,total=dur.reduce(function(a,b){return a+b},0);
  function before(i){var a=0;for(var k=0;k<i;k++)a+=dur[k];return a}
  scenes.forEach(function(s,i){
    T.push(setTimeout(function(){
      scenes.forEach(function(x){x.classList.remove('on')});
      void s.offsetWidth;s.classList.add('on');
      bar.style.width=((before(i)+dur[i])/total*100)+'%';
    },at));
    at+=dur[i];
  });
  T.push(setTimeout(function(){bar.style.width='0';start.textContent='↻ عاود';start.style.display='block'},at+1500));
}
start.onclick=play;
</script>
</body>
</html>
